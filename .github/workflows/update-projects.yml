name: Update projects

on:
  schedule:
    - cron: "0 3 * * *" # her gün 03:00 UTC — silinen/yeni repolar bir günde yansır
  push:
    branches: [main]
    paths: [".github/descriptions.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate projects.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/update-projects.ts
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --cached --quiet || git commit -m "chore: update projects.json"
          git push
